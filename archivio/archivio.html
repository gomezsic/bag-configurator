<title>Archivio QG Bags</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Questrial&family=Cinzel:wght@500;700&family=Pinyon+Script&display=swap">
<style>
/* Layout: archivio a schede. Elenco a sinistra, modulo guidato a destra, stesso linguaggio dello Studio */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --fg:#141a2b; --muted:#5a6275; --line:#d6d9e2;
  --accent:#1b3f99; --accent-soft:#e3e9f8; --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#a2611a; --warn-soft:#f8ecdc; --bad:#a8243a; --bad-soft:#f7e1e5;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131d; --surface:#171c29; --fg:#e8ebf3; --muted:#9aa2b6; --line:#2a3142;
  --accent:#8fb0ff; --accent-soft:#1d2842; --ok:#6fd3a0; --ok-soft:#15302a; --warn:#e6a85c; --warn-soft:#33281a; --bad:#f08a9a; --bad-soft:#3a1d25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131d; --surface:#171c29; --fg:#e8ebf3; --muted:#9aa2b6; --line:#2a3142;
  --accent:#8fb0ff; --accent-soft:#1d2842; --ok:#6fd3a0; --ok-soft:#15302a; --warn:#e6a85c; --warn-soft:#33281a; --bad:#f08a9a; --bad-soft:#3a1d25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 clamp(1.6rem,3.4vw,2.2rem)/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:700 1.25rem/1.2 var(--display);margin:0;text-wrap:balance}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
p{margin:0;max-width:75ch}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.mono{font-family:var(--mono)}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.84rem;font-variant-numeric:tabular-nums}
.count b{font:700 1rem var(--display);margin-right:4px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;color:var(--muted);font:600 .92rem var(--body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button .n{font:500 .7rem var(--mono);color:var(--muted);margin-left:4px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;font-size:.88rem}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px;min-width:0}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;width:100%;font:inherit}
.item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.item .t{font-weight:600;font-size:.92rem;line-height:1.25}
.item .s{font-size:.76rem;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.item canvas,.item .thumb{flex:none;border-radius:3px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:4px;font:500 .68rem/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:4px 7px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.off{border-color:var(--line);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:22px;min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.step{display:flex;flex-direction:column;gap:12px;min-width:0}
.step>h3{display:flex;align-items:center;gap:10px;margin:0;font:700 1rem var(--display)}
.step>h3 .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font:500 .75rem/24px var(--mono);text-align:center;flex:none}
.step>h3 .num.ok{background:var(--ok)}
.step>h3 .aside{margin-left:auto;font:500 .72rem var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
.grid .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:.78rem;color:var(--muted);font-weight:500}
input.i,select.i,textarea.i{border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);padding:7px 9px;font:.92rem var(--body);width:100%;min-width:0}
textarea.i{min-height:70px;resize:vertical}
input.i:focus-visible,select.i:focus-visible,textarea.i:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:2px;flex:none;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.nowrap{flex-wrap:nowrap}
button.b{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:7px 11px;font:500 .84rem var(--body);cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--accent)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.b.danger{color:var(--bad)}
button.b.danger.arm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.b.sm{padding:4px 8px;font-size:.78rem}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.92rem}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.status{font:.76rem var(--mono);color:var(--muted)}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.spec{font-size:.8rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.spec b{color:var(--fg);font-weight:600}
/* file slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:flex-start;background:var(--bg);min-width:0}
.slot.has{border-style:solid}
.slot.req:not(.has){border-color:var(--warn)}
.slot .pv{width:64px;height:64px;flex:none;border-radius:4px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/12px 12px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font:500 .65rem var(--mono)}
.slot .pv img{width:100%;height:100%;object-fit:contain}
.slot .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.slot .nm{font-weight:600;font-size:.86rem;line-height:1.25}
.slot .ky{font:500 .7rem var(--mono);color:var(--muted);word-break:break-all}
.slot .msg{font-size:.76rem;line-height:1.3}
.slot .msg.ok{color:var(--ok)} .slot .msg.warn{color:var(--warn)} .slot .msg.bad{color:var(--bad)}
.slot input[type=file]{display:none}
.todo{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none;font-size:.88rem}
.todo li{display:flex;gap:8px;align-items:baseline}
.todo li::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;background:var(--warn);transform:translateY(1px)}
.todo li.ok::before{background:var(--ok)}
.todo li.ok{color:var(--muted)}
/* tables of rows */
.rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.r .i{flex:1 1 140px}
.r .i.n{flex:0 0 100px}
.strip{display:flex;height:42px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.strip div{height:100%}
/* matrix */
.mx{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:72vh}
.mx table{border-collapse:separate;border-spacing:0;font-size:.82rem}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:0;background:var(--surface)}
.mx thead th{position:sticky;top:0;z-index:2;vertical-align:bottom;padding:8px 4px;font:500 .72rem var(--mono);min-width:44px}
.mx thead th .hs{width:26px;height:44px;margin:0 auto 4px;border-radius:2px;display:flex;overflow:hidden;border:1px solid var(--line)}
.mx thead th .hs i{flex:1 0 auto;height:100%}
.mx thead th .zd{display:block;width:10px;height:10px;border-radius:50%;margin:3px auto 0;border:1px solid var(--line)}
.mx .rh{position:sticky;left:0;z-index:1;text-align:left;padding:6px 10px;min-width:210px;border-right:1px solid var(--line)}
.mx thead .rh{z-index:3}
.mx .rh .row{gap:8px;flex-wrap:nowrap}
.mx .rh .sq{width:22px;height:22px;border-radius:3px;flex:none;border:1px solid var(--line)}
.mx .fam td,.mx .fam th{background:var(--bg);font:600 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.mx td.c{text-align:center}
.mx td.c button{width:40px;height:34px;border:0;background:none;cursor:pointer;color:var(--fg);font-size:1rem}
.mx td.c button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mx td.c button:hover{outline:1px solid var(--accent);outline-offset:-3px}
.mx td.st{padding:4px 10px;white-space:nowrap}
/* collections */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card canvas{width:100%;height:auto;aspect-ratio:4/3;border-radius:4px;background:var(--bg)}
.card .t{font-weight:600}
/* embroidery */
.emb{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.emb{grid-template-columns:1fr}}
.emb canvas{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:var(--bg);display:block}
.fonts{display:flex;flex-wrap:wrap;gap:6px}
.fonts button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:1.15rem}
.fonts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.price{font:700 1.4rem var(--display);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">QG Bags · configuratore</div>
      <h1>Archivio di modelli, tessuti e manici</h1>
      <p class="muted" style="margin-top:6px">Qui inserisci tutto quello che serve al configuratore. Ogni modulo ti dice quali file caricare e se sono giusti; i punti arancioni sono quelli che mancano.</p>
    </div>
    <div class="counts" id="counts" aria-live="polite"></div>
  </header>
  <div class="notice warn" id="offline" hidden></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>(v===''||v==null||isNaN(+v))?'da definire':(+v).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const clone=o=>JSON.parse(JSON.stringify(o??null));
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k];});a[ks[ks.length-1]]=v;};
const blob=id=>'/_blob/'+id;
const hm=()=>new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

// ---------- standard (uguali alla guida) ----------
const STD={foto:2400,tess:2362,man:2953};
const LAYERS=[
 {k:'corpo_fronte',l:'Corpo, faccia davanti',req:1},
 {k:'corpo_sopra',l:'Corpo, parte sopra'},
 {k:'corpo_retro',l:'Corpo, faccia dietro'},
 {k:'fianco_sx',l:'Fianco sinistro'},
 {k:'fianco_dx',l:'Fianco destro'},
 {k:'fondo',l:'Fondo (solo se di altro materiale)'},
 {k:'manico_davanti',l:'Manico davanti',req:1},
 {k:'manico_dietro',l:'Manico dietro'},
 {k:'tracolla',l:'Tracolla'},
 {k:'linguetta_sx',l:'Linguetta sinistra'},
 {k:'linguetta_dx',l:'Linguetta destra'},
 {k:'zip',l:'Nastro della zip',req:1},
 {k:'metalli',l:'Metalli (bronzo vero, sopra a tutto)'},
 {k:'ricamo',l:'Zona del ricamo',ric:1},
 {k:'ombra_terra',l:'Ombra sul fondo bianco'},
];
const ETICHETTE=['Più venduto','Preferito','Novità','Collezione'];
const TIPI_TESSUTO=['Neoprene','Cotone','Tramé','Velluto','Velluto stampato','Tela','Ecopelle'];

// ---------- stato ----------
const S={modelli:{},tessuti:{},manici:{},collezioni:{},matrice:{righe:{}},ricamo:null};
const RIC_DEF={prezzo:'',altezzaMin:0.8,altezzaMax:3,font:[]};
const UI={tab:'modelli',sel:{},view:{},dirty:{},timers:{},arm:null};
let db=null,assets=null,user=null,canWrite=true,loaded=false;

const TABS=[['modelli','Modelli'],['tessuti','Tessuti'],['manici','Manici'],['abbinamenti','Abbinamenti'],['collezioni','Collezioni'],['ricamo','Ricamo']];
function renderTabs(){
 $('tabs').innerHTML=TABS.map(([k,l])=>{const n=k==='abbinamenti'?'':k==='ricamo'?'':Object.keys(S[k]).length;
  return `<button role="tab" id="tab-${k}" aria-selected="${UI.tab===k}" data-tab="${k}">${l}${n!==''?`<span class="n">${n}</span>`:''}</button>`}).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;try{history.replaceState(null,'','#'+UI.tab)}catch(e){};UI.arm=null;render();});
}
function renderCounts(){
 const M=Object.values(S.modelli),pub=M.filter(m=>m.pubblicato).length;
 const cols=allColours(),noH=cols.filter(c=>!(S.matrice.righe[c.id]||[]).length).length;
 const noZip=Object.values(S.manici).filter(h=>!h.zip||!h.zip.hex).length;
 $('counts').innerHTML=`<span class="count"><b>${M.length}</b>modelli · ${pub} pubblicati</span>
  <span class="count"><b>${cols.length}</b>colori di tessuto</span>
  <span class="count"><b>${Object.keys(S.manici).length}</b>manici</span>
  ${noH?`<span class="count"><b>${noH}</b>colori senza manici</span>`:''}
  ${noZip?`<span class="count"><b>${noZip}</b>manici senza zip</span>`:''}`;
}
function render(){renderTabs();renderCounts();({modelli:vModelli,tessuti:vTessuti,manici:vManici,abbinamenti:vMatrice,collezioni:vCollezioni,ricamo:vRicamo})[UI.tab]();}

// ---------- salvataggio ----------
function statusEl(){return document.querySelector('#view .savest');}
function setStatus(t,c){const e=statusEl();if(e){e.textContent=t;e.className='status savest'+(c?' '+c:'');}}
function touch(col,id){const key=col+'/'+id;UI.dirty[key]=1;setStatus(db?'Modifiche in salvataggio…':'Modifiche non salvate: apri la pagina da claude.ai per salvare.','warn');clearTimeout(UI.timers[key]);if(db)UI.timers[key]=setTimeout(()=>save(col,id),900);renderCounts();}
async function save(col,id){const key=col+'/'+id;const data=col==='abbinamenti'?S.matrice:col==='impostazioni'?S.ricamo:S[col][id];if(!data)return;
 try{data.aggiornato=new Date().toISOString();await db.doc(key).set(clone(data));delete UI.dirty[key];setStatus('Salvato alle '+hm(),'ok');}
 catch(e){setStatus('Non salvato ('+(e&&e.code||'errore')+'). Riprova tra poco.','bad');}}
async function remove(col,id){clearTimeout(UI.timers[col+'/'+id]);delete S[col][id];UI.sel[col]=null;if(db){try{await db.doc(col+'/'+id).delete();}catch(e){}}render();}
function armDelete(btn,fn){if(UI.arm===btn.dataset.key){UI.arm=null;fn();return;}UI.arm=btn.dataset.key;btn.classList.add('arm');btn.textContent='Conferma: elimina';setTimeout(()=>{if(UI.arm===btn.dataset.key){UI.arm=null;btn.classList.remove('arm');btn.textContent=btn.dataset.label;}},4000);}

// bind generico dei campi: data-k = percorso, data-t = num|bool|str, data-re = ridisegna
function bind(root,obj,col,id,after){
 root.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k,t=el.dataset.t||'str',v=getP(obj,k);
  if(t==='bool')el.checked=!!v;else el.value=v??'';
  const ev=(el.tagName==='SELECT'||t==='bool'||el.type==='color')?'change':'input';
  el.addEventListener(ev,()=>{let x=t==='bool'?el.checked:el.value;if(t==='num')x=el.value===''?'':+String(el.value).replace(',','.');setP(obj,k,x);touch(col,id);if(el.dataset.re)after&&after();else refreshSide();});
  if(el.type==='color'&&ev==='change')el.addEventListener('input',()=>{setP(obj,k,el.value);refreshSide(true);});
 });
}
let sideFn=null;function refreshSide(light){sideFn&&sideFn(light);}

// ---------- file: lettura e controllo ----------
async function readImg(file){try{const bm=await createImageBitmap(file);const w=bm.width,h=bm.height;
  const c=document.createElement('canvas');const sc=Math.min(1,160/Math.max(w,h));c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));const x=c.getContext('2d');x.drawImage(bm,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data;let sat=0,alpha=0,n=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<250)alpha++;if(d[i+3]>20){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);sat+=mx?(mx-mn)/mx:0;n++;}}
  return {w,h,sat:n?sat/n:0,alpha:alpha/(d.length/4)};}catch(e){return null;}}
function checkFile(kind,info,file,ctx){
 const out=[];const t=(file&&file.type)||'';
 if(!info){out.push(['warn','Non riesco a leggere le misure di questo file (TIFF?). Va bene lo stesso, lo controllo io.']);return out;}
 const dim=`${info.w} × ${info.h} px`;
 if(kind==='foto'){if(info.w===STD.foto&&info.h===STD.foto)out.push(['ok',dim+', tela giusta']);else out.push(['warn',`${dim}: la tela dev'essere ${STD.foto} × ${STD.foto} px`]);
  if(info.sat>.12)out.push(['warn','La foto sembra colorata: serve neutra (tessuto chiaro, manici bianchi)']);}
 if(kind==='livello'){const f=ctx&&ctx.foto;if(f&&f.w&&(info.w!==f.w||info.h!==f.h))out.push(['bad',`${dim}: non è la stessa tela della foto (${f.w} × ${f.h})`]);else out.push(['ok',dim]);
  if(!/png/.test(t))out.push(['warn','Serve PNG con trasparenza']);else if(info.alpha<.02)out.push(['warn','Non vedo trasparenza: esporta solo il pezzo, il resto trasparente']);}
 if(kind==='tessuto'){const m=Math.min(info.w,info.h);if(m>=STD.tess)out.push(['ok',dim+', risoluzione giusta']);else if(m>=1200)out.push(['warn',`${dim}: un po' piccola, lo standard è ${STD.tess} px (20 cm a 300 dpi)`]);else out.push(['bad',`${dim}: troppo piccola, serve ${STD.tess} × ${STD.tess} px`]);

async function uploadTo(file,kind,ctx){

async function paintFabric(ctx,w,h,col,fam,scale){
 const t=fam||{};const hex=col&&col.hex||'#bbbbbb';
 const own=col&&col.foto&&col.foto.id, neu=t.neutro&&t.neutro.id;
 const im=await loadImg(own||neu);
 if(!im){ctx.fillStyle=hex;ctx.fillRect(0,0,w,h);return;}
 const s=scale||1;const tw=im.width*s,th=im.height*s;
 for(let y=0;y<h;y+=th)for(let x=0;x<w;x+=tw)ctx.drawImage(im,x,y,tw,th);
 if(own)return;
 const d=ctx.getImageData(0,0,w,h),p=d.data,[r,g,b]=hx(hex);
 for(let i=0;i<p.length;i+=4){const l=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)/255;const k=Math.min(1.35,l/.64);p[i]=r*k;p[i+1]=g*k;p[i+2]=b*k;}
 ctx.putImageData(d,0,0);}

// stesso metodo di bands.py: mediana per colonna, salti di colore > 40, unione sotto il 3%
function readBands(im){const W=Math.min(600,im.width),H=Math.min(600,im.height);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
 const horiz=im.width>=im.height; // nastro disteso in orizzontale: le bande sono le righe
 const N=horiz?H:W,M=horiz?W:H;const cols=[];
 for(let a=0;a<N;a++){const R=[],G=[],B=[];for(let b=Math.floor(M*.2);b<M*.8;b+=2){const i=horiz?(a*W+b)*4:(b*W+a)*4;R.push(d[i]);G.push(d[i+1]);B.push(d[i+2]);}const md=v=>v.sort((p,q)=>p-q)[v.length>>1];cols.push([md(R),md(G),md(B)]);}
 // togli i bordi chiari dello sfondo
 const segs=[];let s=0;const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
 for(let i=1;i<=N;i++){if(i===N||dist(cols[i],cols[i-1])>40){segs.push([s,i]);s=i;}}
 const toHex=c=>'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
 let out=segs.map(([a,b])=>{const mid=cols.slice(a,b).sort((p,q)=>(p[0]+p[1]+p[2])-(q[0]+q[1]+q[2]));return {c:mid[mid.length>>1],n:b-a};});
 const tot=N;out=out.filter(o=>o.n/tot>=.03);
 const merged=[];out.forEach(o=>{const l=merged[merged.length-1];if(l&&dist(l.c,o.c)<30){l.n+=o.n;}else merged.push({...o});});
 const T=merged.reduce((a,o)=>a+o.n,0);return merged.map(o=>({c:toHex(o.c),w:+(o.n/T*100).toFixed(1)}));}

  Object.keys(S[col]).forEach(id=>{if(!qs.docs.some(d=>d.id===id)&&!UI.dirty[col+'/'+id])delete S[col][id];});rerender();};
 ['modelli','tessuti','manici','collezioni'].forEach(col=>db.collection(col).onSnapshot(onCol(col),e=>showErr(e)));
 db.doc('abbinamenti/matrice').onSnapshot(s=>{if(UI.dirty['abbinamenti/matrice'])return;S.matrice=s.exists?clone(s.data()):{righe:{}};S.matrice.righe=S.matrice.righe||{};rerender();},showErr);
 db.doc('impostazioni/ricamo').onSnapshot(s=>{if(UI.dirty['impostazioni/ricamo'])return;S.ricamo=s.exists?clone(s.data()):clone(RIC_DEF);rerender();},showErr);
})();
function showErr(e){$('offline').hidden=false;$('offline').textContent='Non riesco a leggere l’archivio ('+(e&&e.code||'errore')+'). Ricarica la pagina.';}
// ridisegna solo se non stai scrivendo in un campo
let rrT=null;function rerender(){clearTimeout(rrT);rrT=setTimeout(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('view').contains(a)){renderCounts();renderTabs();return;}render();},120);}
</script>
